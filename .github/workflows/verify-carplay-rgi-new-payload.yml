name: Verify CarPlay RGI New payload

on:
  push:
    branches:
      - feature/carplay-rgi-new
    paths:
      - '.github/workflows/verify-carplay-rgi-new-payload.yml'
      - 'Toolbox/apps/carplay-rgi-new/carplay_hook.jar'
      - 'Toolbox/apps/carplay-rgi-new/libcarplay_hook.so'
      - 'Toolbox/apps/carplay-rgi-new/maneuver_render'
      - 'Toolbox/apps/carplay-rgi-new/flag_atlas.rgba'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute SHA-256
        run: |
          sha256sum \
            Toolbox/apps/carplay-rgi-new/carplay_hook.jar \
            Toolbox/apps/carplay-rgi-new/libcarplay_hook.so \
            Toolbox/apps/carplay-rgi-new/maneuver_render \
            Toolbox/apps/carplay-rgi-new/flag_atlas.rgba
