name: One-off CarPlay RGI audit patch

on:
  push:
    branches:
      - feature/carplay-rgi-new

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/carplay-rgi-new
          fetch-depth: 0

      - name: Apply targeted audit improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          install = Path('Toolbox/scripts/install_carplay_rgi_new.sh')
          s = install.read_text()

          s = replace_once(
              s,
              '      "Existing CarPlayRGI-new stock backup"\n    return\n',
              '      "Existing CarPlayRGI-new stock backup"\n'
              '    log "[backup] REUSE: ${BACKUPFOLDER}/smartphone_integrator.json (no copy performed)"\n'
              '    log "[backup] REUSE: ${BACKUPFOLDER}/dio_manager.json (no copy performed)"\n'
              '    return\n',
              'existing backup audit')

          s = replace_once(
              s,
              '  cp "${SMARTPHONE_JSON}" "${BACKUPFOLDER}/smartphone_integrator.json" || \\\n'
              '    fail "Could not back up ${SMARTPHONE_JSON}"\n',
              '  log "[backup] cp ${SMARTPHONE_JSON} -> ${BACKUPFOLDER}/smartphone_integrator.json"\n'
              '  cp "${SMARTPHONE_JSON}" "${BACKUPFOLDER}/smartphone_integrator.json" || \\\n'
              '    fail "Could not back up ${SMARTPHONE_JSON}"\n'
              '  log "[backup] OK: ${SMARTPHONE_JSON} -> ${BACKUPFOLDER}/smartphone_integrator.json"\n',
              'smartphone backup audit')

          s = replace_once(
              s,
              '  cp "${DIO_JSON}" "${BACKUPFOLDER}/dio_manager.json" || \\\n'
              '    fail "Could not back up ${DIO_JSON}"\n',
              '  log "[backup] cp ${DIO_JSON} -> ${BACKUPFOLDER}/dio_manager.json"\n'
              '  cp "${DIO_JSON}" "${BACKUPFOLDER}/dio_manager.json" || \\\n'
              '    fail "Could not back up ${DIO_JSON}"\n'
              '  log "[backup] OK: ${DIO_JSON} -> ${BACKUPFOLDER}/dio_manager.json"\n',
              'dio backup audit')

          s = replace_once(
              s,
              '  cp "${OLD_BACKUPFOLDER}/smartphone_integrator.json" "${SMARTPHONE_JSON}.carplay-rgi-new.tmp" || \\\n',
              '  log "[restore] cp ${OLD_BACKUPFOLDER}/smartphone_integrator.json -> ${SMARTPHONE_JSON}.carplay-rgi-new.tmp"\n'
              '  cp "${OLD_BACKUPFOLDER}/smartphone_integrator.json" "${SMARTPHONE_JSON}.carplay-rgi-new.tmp" || \\\n',
              'legacy smartphone restore start')
          s = replace_once(
              s,
              '  mv "${SMARTPHONE_JSON}.carplay-rgi-new.tmp" "${SMARTPHONE_JSON}" || fail "Could not restore stock smartphone_integrator.json"\n',
              '  mv "${SMARTPHONE_JSON}.carplay-rgi-new.tmp" "${SMARTPHONE_JSON}" || fail "Could not restore stock smartphone_integrator.json"\n'
              '  log "[restore] OK: ${OLD_BACKUPFOLDER}/smartphone_integrator.json -> ${SMARTPHONE_JSON}"\n',
              'legacy smartphone restore success')

          s = replace_once(
              s,
              '  cp "${OLD_BACKUPFOLDER}/dio_manager.json" "${DIO_JSON}.carplay-rgi-new.tmp" || \\\n',
              '  log "[restore] cp ${OLD_BACKUPFOLDER}/dio_manager.json -> ${DIO_JSON}.carplay-rgi-new.tmp"\n'
              '  cp "${OLD_BACKUPFOLDER}/dio_manager.json" "${DIO_JSON}.carplay-rgi-new.tmp" || \\\n',
              'legacy dio restore start')
          s = replace_once(
              s,
              '  mv "${DIO_JSON}.carplay-rgi-new.tmp" "${DIO_JSON}" || fail "Could not restore stock dio_manager.json"\n',
              '  mv "${DIO_JSON}.carplay-rgi-new.tmp" "${DIO_JSON}" || fail "Could not restore stock dio_manager.json"\n'
              '  log "[restore] OK: ${OLD_BACKUPFOLDER}/dio_manager.json -> ${DIO_JSON}"\n',
              'legacy dio restore success')

          comment_function = r'''ensure_dio_rgi_comments() {
            FILE="$1"
            TMP="${FILE}.carplay-rgi-new-comments.tmp"

            # Documentation-only annotations: normalize them so updates remain idempotent.
            awk '
              function leading_ws(s) {
                match(s,/^[ \t]*/)
                return substr(s,1,RLENGTH)
              }
              function is_rgi_comment(s) {
                return s ~ /^[ \t]*#[ \t]*,[ \t]*0x5200\/\* StartRouteGuidanceUpdates \*\/[ \t]*$/ ||
                       s ~ /^[ \t]*#[ \t]*,[ \t]*0x5203\/\* StopRouteGuidanceUpdates \*\/[ \t]*$/ ||
                       s ~ /^[ \t]*#[ \t]*0x5201\/\* RouteGuidanceUpdate \*\/[ \t]*$/ ||
                       s ~ /^[ \t]*#[ \t]*0x5202\/\* RouteGuidanceManeuverUpdate \*\/[ \t]*$/ ||
                       s ~ /^[ \t]*#[ \t]*0x5204\/\* RouteGuidanceLaneGuidanceInformation \*\/[ \t]*$/
              }
              {
                line=$0
                if (is_rgi_comment(line)) next
                if (line ~ /^[ \t]*"MessagesSentByAccessory"[ \t]*:/) {
                  indent=leading_ws(line)
                  print indent "# , 0x5200/* StartRouteGuidanceUpdates */"
                  print indent "# , 0x5203/* StopRouteGuidanceUpdates */"
                } else if (line ~ /^[ \t]*"MessagesReceivedFromDevice"[ \t]*:/) {
                  indent=leading_ws(line)
                  print indent "# 0x5201/* RouteGuidanceUpdate */"
                  print indent "# 0x5202/* RouteGuidanceManeuverUpdate */"
                  print indent "# 0x5204/* RouteGuidanceLaneGuidanceInformation */"
                }
                print line
              }
            ' "${FILE}" > "${TMP}" || fail "Could not add CarPlay RGI comments to $(basename "${FILE}")"

            chmod 644 "${TMP}" || fail "Could not chmod commented $(basename "${FILE}")"
            mv "${TMP}" "${FILE}" || fail "Could not install commented $(basename "${FILE}")"

            set -- `awk '
              /#[ \t]*,[ \t]*0x5200\/\* StartRouteGuidanceUpdates \*\// { a++ }
              /#[ \t]*,[ \t]*0x5203\/\* StopRouteGuidanceUpdates \*\// { b++ }
              /#[ \t]*0x5201\/\* RouteGuidanceUpdate \*\// { c++ }
              /#[ \t]*0x5202\/\* RouteGuidanceManeuverUpdate \*\// { d++ }
              /#[ \t]*0x5204\/\* RouteGuidanceLaneGuidanceInformation \*\// { e++ }
              END { print a+0, b+0, c+0, d+0, e+0 }
            ' "${FILE}"`
            if [ "$1" -ne 1 ] || [ "$2" -ne 1 ] || [ "$3" -ne 1 ] || \
               [ "$4" -ne 1 ] || [ "$5" -ne 1 ]; then
              fail "CarPlay RGI comment verification failed"
            fi
            log "CarPlay RGI message ID comments verified"
          }

          '''
          s = replace_once(s, 'patch_dio_manager() {\n', comment_function + 'patch_dio_manager() {\n', 'dio comment function insert')
          s = replace_once(
              s,
              '  append_json_array_value "${DIO_JSON}" "MessagesReceivedFromDevice" "0x5204"\n}\n\ncopy_component() {',
              '  append_json_array_value "${DIO_JSON}" "MessagesReceivedFromDevice" "0x5204"\n'
              '  ensure_dio_rgi_comments "${DIO_JSON}"\n'
              '}\n\ncopy_component() {',
              'dio comment call')
          install.write_text(s)

          uninstall = Path('Toolbox/scripts/uninstall_carplay_rgi_new.sh')
          u = uninstall.read_text()
          u = replace_once(
              u,
              '  cp "${SOURCE}" "${TMP}" || fail "Could not stage stock $(basename "${TARGET}")"\n',
              '  log "[restore] cp ${SOURCE} -> ${TMP}"\n'
              '  cp "${SOURCE}" "${TMP}" || fail "Could not stage stock $(basename "${TARGET}")"\n',
              'uninstall restore start')
          u = replace_once(
              u,
              '  mv "${TMP}" "${TARGET}" || fail "Could not restore stock $(basename "${TARGET}")"\n}\n',
              '  mv "${TMP}" "${TARGET}" || fail "Could not restore stock $(basename "${TARGET}")"\n'
              '  log "[restore] OK: ${SOURCE} -> ${TARGET}"\n'
              '}\n',
              'uninstall restore success')
          uninstall.write_text(u)
          PY

      - name: Static syntax check
        run: |
          sh -n Toolbox/scripts/install_carplay_rgi_new.sh
          sh -n Toolbox/scripts/uninstall_carplay_rgi_new.sh

      - name: Commit patch and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-carplay-rgi-audit-patch.yml
          git add Toolbox/scripts/install_carplay_rgi_new.sh Toolbox/scripts/uninstall_carplay_rgi_new.sh
          git commit -m "improve CarPlay RGI config audit logging"
          git push origin HEAD:feature/carplay-rgi-new
